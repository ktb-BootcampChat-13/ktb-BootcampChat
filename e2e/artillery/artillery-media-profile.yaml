config:
  target: "{{ $env.BASE_URL }}"
  phases:
    - name: "media and profile"
      duration: "{{ $env.PHASE1_DURATION }}"
      arrivalCount: "{{ $env.PHASE1_ARRIVAL_COUNT }}"
  processor: "./profile-scenarios.js"
  engines:
    playwright:
      launchOptions:
        headless: true
      contextOptions:
        viewport: null

scenarios:
  - engine: playwright
    flowFunction: mediaProfile
